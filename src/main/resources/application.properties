# Nombre de la aplicación
spring.application.name=mini-tasks

# Configuración de base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:minitasksdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola web de H2 (accesible en /h2-console)
spring.h2.console.enabled=true